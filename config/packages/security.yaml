security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        customers:
            id: App\Identity\Infrastructure\Security\DemoCustomerProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: customers
            http_basic:
                realm: Mantinely

    access_control:
        - { path: ^/objednavky, roles: ROLE_CUSTOMER }
        - { path: ^/admin, roles: ROLE_STAFF }
        - { path: ^/sprava, roles: ROLE_STAFF }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
